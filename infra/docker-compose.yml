name: gov-system

# Single internal network. Only the gateway publishes ports to the host.
networks:
  internal:
    driver: bridge

volumes:
  pgdata:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL — internal only, not reachable from outside the host.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host. Uncomment for local debugging with a
    # DB client (127.0.0.1 only — never expose Postgres publicly):
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ---------------------------------------------------------------------
  # Backend — NestJS API. Dockerfile is owned/maintained separately at
  # apps/backend/Dockerfile. Reached only through the gateway at /api/.
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ../apps/backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Internal only — not published to the host.
    expose:
      - "3000"

  # ---------------------------------------------------------------------
  # web-admin — React/Vite SPA built and served by its own nginx (see
  # apps/web-admin/Dockerfile). Internal only, fronted by the gateway.
  # ---------------------------------------------------------------------
  web-admin:
    build:
      context: ../apps/web-admin
    restart: unless-stopped
    networks:
      - internal
    expose:
      - "80"

  # ---------------------------------------------------------------------
  # Gateway — the only service publishing ports to the host. Terminates
  # TLS and reverse-proxies / -> web-admin, /api/ -> backend:3000.
  # ---------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web-admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal
