# Gateway server block(s). server_name is "_" (catch-all) because we are
# accessed by bare IP for now; swap in a real server_name once a domain
# is pointed here, and this is also where certbot/Let's Encrypt hooks in.

# Needed so the "Connection" header is only sent as "upgrade" for actual
# websocket requests (used on the /api/ location below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
# :80 — plain HTTP, redirect everything to HTTPS.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# :443 — TLS termination + reverse proxy.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    # -------------------------------------------------------------
    # API — proxied to the NestJS backend.
    #
    # IMPORTANT prefix handling: the trailing slash on both the
    # "location /api/" match and the "proxy_pass http://backend:3000/"
    # target tells nginx to REPLACE the matched "/api/" prefix rather
    # than append to it. So:
    #   https://<host>/api/users  ->  http://backend:3000/users
    # The backend app should NOT mount a global "/api" prefix itself —
    # it should serve routes at its own root. If the backend ever adds
    # a global prefix (e.g. Nest's app.setGlobalPrefix('api')), drop
    # the trailing slash from proxy_pass instead so /api is preserved.
    # -------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (e.g. Socket.IO / Nest gateways under /api/)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------
    # Frontend — web-admin SPA. web-admin's own nginx (see
    # apps/web-admin/Dockerfile) already does try_files -> index.html,
    # so a plain proxy_pass here is sufficient.
    # -------------------------------------------------------------
    location / {
        proxy_pass http://web-admin:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
