# Gateway server block(s). server_name is "_" (catch-all) because we are
# accessed by bare IP for now; swap in a real server_name once a domain
# is pointed here, and this is also where certbot/Let's Encrypt hooks in.

# Rate-limiting zones. Defined here (conf.d is included inside http{}) rather than
# in nginx.conf, because nginx.conf is a single-file bind mount whose inode goes
# stale on `git pull` — keeping these in the directory-mounted conf.d lets a plain
# `nginx -s reload` pick them up on deploy.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Needed so the "Connection" header is only sent as "upgrade" for actual
# websocket requests (used on the /api/ location below).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------
# :80 — plain HTTP, redirect everything to HTTPS.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# :443 — TLS termination + reverse proxy.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Real Let's Encrypt cert for murojaatnoma.uz (mounted from the host's
    # /etc/letsencrypt). Falls back conceptually to the self-signed set in
    # ./certs only if you switch these paths back. Renewal: certbot on the
    # host + renewal-hooks that stop/start this gateway container.
    ssl_certificate     /etc/letsencrypt/live/murojaatnoma.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaatnoma.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25m;

    # Security headers (server-scope; nginx propagates these into locations that
    # define no add_header of their own, which is the case for both / and /api/).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------
    # API — proxied to the NestJS backend.
    #
    # IMPORTANT prefix handling: the trailing slash on both the
    # "location /api/" match and the "proxy_pass http://backend:3000/"
    # target tells nginx to REPLACE the matched "/api/" prefix rather
    # than append to it. So:
    #   https://<host>/api/users  ->  http://backend:3000/users
    # The backend app should NOT mount a global "/api" prefix itself —
    # it should serve routes at its own root. If the backend ever adds
    # a global prefix (e.g. Nest's app.setGlobalPrefix('api')), drop
    # the trailing slash from proxy_pass instead so /api is preserved.
    # -------------------------------------------------------------
    # Auth endpoints get a tighter rate limit (OTP brute-force / SMS-cost abuse).
    # More specific prefix than /api/, so nginx routes /api/auth/* here.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (e.g. Socket.IO / Nest gateways under /api/)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------
    # Frontend — web-admin SPA. web-admin's own nginx (see
    # apps/web-admin/Dockerfile) already does try_files -> index.html,
    # so a plain proxy_pass here is sufficient.
    # -------------------------------------------------------------
    location / {
        proxy_pass http://web-admin:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------
# api.murojaatnoma.uz — the backend as its own host. Unlike the /api/ path
# on the main domain, this does NOT strip a prefix, so paths map 1:1:
#   https://api.murojaatnoma.uz/auth/...  -> backend /auth/...
#   https://api.murojaatnoma.uz/api/docs  -> backend /api/docs (Swagger)
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.murojaatnoma.uz;

    ssl_certificate     /etc/letsencrypt/live/murojaatnoma.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaatnoma.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
