# Murojaatnoma on a shared VM that already runs its own front nginx
# (e.g. the MKO "bitrix-flex" box). Nothing here touches the host's ports
# except ONE loopback listener: the inner gateway on 127.0.0.1:8310. The
# host nginx terminates TLS for murojaatnoma.uz and proxies everything there.
#
#   host nginx :443 (murojaatnoma.uz, www, api)  ->  127.0.0.1:8310 (gateway)
#     gateway  /          -> web-admin:80
#              /api/      -> backend:3000/   (prefix stripped)
#              /socket.io -> backend:3000
#              /uploads/  -> uploads volume (static)
#
# Images are built elsewhere (linux/amd64) and `docker load`-ed here, so the
# VM never runs a heavy npm build. TAG = the git commit they were built from.
name: murojaatnoma

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [internal]

  backend:
    image: murojaatnoma-backend:${TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    env_file: .env
    environment:
      PORT: 3000
      TZ: Asia/Tashkent
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [internal]

  web-admin:
    image: murojaatnoma-web:${TAG}
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    depends_on: [backend, web-admin]
    ports:
      - "127.0.0.1:8310:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
    networks: [internal]
