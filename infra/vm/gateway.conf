# Inner gateway (plain HTTP, loopback-published). TLS is terminated by the
# host nginx, which forwards X-Real-IP / X-Forwarded-Proto.

# Trust the host nginx for the client address, so rate limits are per client
# and not one shared bucket for "the proxy".
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

# Behind a NAT that may present every client as ONE address (the MKO
# FortiGate does: all traffic arrives from 192.168.21.1), so per-IP buckets
# would be shared by everybody. Keep generous limits that only stop floods;
# brute force is still bounded by the backend's own login throttling.
limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

map $http_accept $webp_suffix {
    default   "";
    "~*webp"  ".webp";
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Uploaded files are user content on the web-admin's own origin: they are always
# sandboxed, and anything that is not photo/video/audio is downloaded, never
# opened in the page. (Same media list as the backend's upload-policy.ts; an
# empty value adds no header.)
map $uri $upload_disposition {
    default "attachment";
    "~*\.(?:jpg|jpeg|png|webp|gif|heic|heif|bmp|mp4|mov|m4v|webm|3gp|mkv|avi|m4a|aac|mp3|ogg|oga|opus|wav|amr|caf|flac)$" "";
}

# APK files are saved, never rendered; the manifest that names the latest one
# is always revalidated.
map $uri $apk_disposition {
    default "";
    "~*\.apk$" "attachment";
}

# murojaatnoma.uz / www — SPA + /api + uploads + downloads + socket.io
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 26m;   # 25 MB file + multipart overhead

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/auth/ {
        limit_req zone=auth burst=40 nodelay;
        proxy_pass http://backend:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /api/ {
        limit_req zone=api burst=400 nodelay;
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Content-Disposition $upload_disposition always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/uploads/.+\.(?:png|jpe?g)$ {
        root /var/www;
        autoindex off;
        add_header Vary Accept always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "sandbox" always;
        add_header Content-Disposition $upload_disposition always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri$webp_suffix $uri =404;
    }

    # Android apps for self-install (written by infra/vm/release-apk.sh).
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition $apk_disposition always;
        add_header Cache-Control "no-cache" always;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web-admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}

# api.murojaatnoma.uz — the backend 1:1 (no /api prefix to strip)
server {
    listen 80;
    server_name api.murojaatnoma.uz;
    client_max_body_size 26m;   # 25 MB file + multipart overhead
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        limit_req zone=api burst=400 nodelay;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
