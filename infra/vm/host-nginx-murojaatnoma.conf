# /etc/nginx/sites-available/murojaatnoma — host (front) nginx.
# Only these three names; every other site on this box is untouched.
# Uses $connection_upgrade from /etc/nginx/conf.d/mko-proxy.conf.

server {
    listen 80;
    listen [::]:80;
    server_name murojaatnoma.uz www.murojaatnoma.uz api.murojaatnoma.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name murojaatnoma.uz www.murojaatnoma.uz api.murojaatnoma.uz;

    ssl_certificate     /etc/letsencrypt/live/murojaatnoma.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murojaatnoma.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:MUROJAAT_SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;
    access_log /var/log/nginx/murojaatnoma.access.log;
    error_log  /var/log/nginx/murojaatnoma.error.log;

    location / {
        proxy_pass http://127.0.0.1:8310;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering off;
    }
}
