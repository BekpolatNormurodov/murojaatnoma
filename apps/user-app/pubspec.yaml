name: user_app
description: "Hokimiyat — fuqarolar uchun mobil ilova."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.8+9

environment:
  sdk: '>=3.10.0-0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Shared internal packages — design system (app_ui) + core infra (app_core)
  app_ui:
    path: ../../packages/app_ui
  app_core:
    path: ../../packages/app_core

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management — Bloc / Cubit
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.1

  # Animations (super animations)
  flutter_animate: ^4.5.2

  # Iconsax icons
  iconsax_plus: ^1.0.0

  # Functional error handling (Either<Failure, T>)
  dartz: ^0.10.1

  # Local storage
  shared_preferences: ^2.3.3

  # Formatting / i18n
  intl: ^0.20.2

  # Encrypted local storage (tokens / future PIN + face cache)
  flutter_secure_storage: ^9.2.2

  # Runtime permission prompts (camera / location — future features)
  permission_handler: ^11.3.1

  # PIN/biometric app lock (used later — foundation only for now)
  local_auth: ^2.3.0

  # GPS / geolocation (future requests/geofence features)
  geolocator: ^13.0.2

  # Charts (future spend/report screens)
  fl_chart: ^0.69.0

  # Filesystem paths (future camera/media caching)
  path_provider: ^2.1.5

  # OS share sheet — used to share the payment receipt as a PNG image.
  share_plus: ^10.1.4

  # Image decode/crop/resize (face frame preprocessing before inference)
  image: ^4.3.0

  # Camera / gallery photo upload for request/complaint attachments
  image_picker: ^1.1.2

  # Raw camera preview + capture (Faza 3: on-device face enrollment) —
  # version pinned to match worker-app's already-working face pipeline.
  camera: ^0.11.0

  # On-device face detection (crop/align before embedding) — Faza 3.
  google_mlkit_face_detection: ^0.13.0

  # On-device model inference (MobileFaceNet embedding — see
  # assets/models/README.md) — Faza 3.
  tflite_flutter: ^0.11.0

  # SHA-256 hashing for the PIN lock (Faza 3) — the PIN is never stored
  # as plaintext, only its hash (see features/pin/domain/services/pin_hasher.dart).
  crypto: ^3.0.6

  # Real on-device local (push-style) notifications — Bildirishnomalar
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Very Good Analysis — strict lint set shared across the monorepo.
  very_good_analysis: ^7.0.0

  # Bloc/Cubit testing (blocTest) + mocking (mocktail) for use-case seams.
  bloc_test: ^10.0.0
  mocktail: ^1.0.0

  # Disables GoogleFonts network fetch during widget tests (flutter_test_config.dart).
  google_fonts: ^6.2.1

  # Generates native launcher icons from assets/icon/*.png — run via
  # `dart run flutter_launcher_icons` after changing the source art.
  flutter_launcher_icons: ^0.14.4

# Hokimiyat brand mark (web-admin/public/favicon.svg: green #10b981 rounded
# square + white shield/check) rasterized to PNG sources — see
# assets/icon/icon.png (full opaque square, iOS + Android legacy) and
# assets/icon/icon_foreground.png (transparent shield-only layer, Android
# adaptive icon foreground).
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#10b981"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/models/mobilefacenet.tflite
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
